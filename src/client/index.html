<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ZombieFront.io - Real-time multiplayer zombie survival strategy game">
    <title>🧟 ZombieFront.io - Zombie Survival RTS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #ffffff;
            overflow: hidden;
        }

        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #menu {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 10px;
            border: 2px solid #00ff00;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
            z-index: 1000;
            text-align: center;
            min-width: 400px;
        }

        #menu h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #00ff00;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
        }

        #menu p {
            color: #888;
            margin-bottom: 30px;
        }

        #menu input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #333;
            border-radius: 5px;
            background: #1a1a1a;
            color: #ffffff;
            font-size: 16px;
        }

        #menu input:focus {
            outline: none;
            border-color: #00ff00;
        }

        #menu button {
            width: 100%;
            padding: 15px;
            background: #00ff00;
            border: none;
            border-radius: 5px;
            color: #000;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        #menu button:hover {
            background: #00dd00;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        #status {
            margin-top: 20px;
            padding: 10px;
            background: rgba(0, 255, 0, 0.1);
            border-radius: 5px;
            font-size: 14px;
            color: #00ff00;
        }

        #game-ui {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }

        .ui-panel {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 5px;
            margin: 10px;
        }

        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .resource-display {
            display: flex;
            gap: 20px;
        }

        .resource-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }

        .resource-icon {
            font-size: 18px;
        }

        #player-count {
            font-size: 14px;
            color: #00ff00;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #00ff00;
            z-index: 10000;
            display: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        .version {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: #666;
            font-size: 12px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <!-- Game Canvas Container -->
    <div id="game-container"></div>

    <!-- Main Menu -->
    <div id="menu">
        <h1>🧟 ZombieFront.io</h1>
        <p>Real-time Zombie Survival Strategy</p>

        <input
            type="text"
            id="player-name"
            placeholder="Enter your name..."
            maxlength="20"
            value="Survivor"
        />

        <button id="join-game">Join Game</button>

        <div id="status" class="pulse">Initializing...</div>
    </div>

    <!-- Game UI -->
    <div id="game-ui">
        <div id="top-bar" class="ui-panel">
            <div class="resource-display">
                <div class="resource-item">
                    <span class="resource-icon">🍕</span>
                    <span id="food">100</span>
                </div>
                <div class="resource-item">
                    <span class="resource-icon">💊</span>
                    <span id="medicine">50</span>
                </div>
                <div class="resource-item">
                    <span class="resource-icon">🔫</span>
                    <span id="weapons">20</span>
                </div>
                <div class="resource-item">
                    <span class="resource-icon">🔧</span>
                    <span id="materials">80</span>
                </div>
                <div class="resource-item">
                    <span class="resource-icon">👥</span>
                    <span id="survivors">5</span>
                </div>
            </div>

            <div id="player-count">Players: 0</div>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div class="loading pulse" id="loading">
        Loading...
    </div>

    <!-- Version Info -->
    <div class="version">
        v0.1.0 - Alpha | Based on OpenFront.io
    </div>

    <!-- Scripts will be injected by Webpack -->
</body>
</html>
